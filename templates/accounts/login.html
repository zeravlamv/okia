{% extends "base.html" %}
{% block title %}Entrar · OKIA{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h3">Entrar</h1>
          {% if error %}
            <p class="alert alert-danger">{{ error }}</p>
          {% endif %}
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label" for="username">Usuario</label>
              <input class="form-control" id="username" name="username" value="{{ username }}" autocomplete="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Contraseña</label>
              <input class="form-control" id="password" name="password" type="password" value="" autocomplete="current-password" required>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" id="remember" type="checkbox" name="remember" {% if remembered %}checked{% endif %}>
              <label class="form-check-label" for="remember">Recordar usuario</label>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" id="keep" type="checkbox" name="keep">
              <label class="form-check-label" for="keep">Mantener la sesión 30 días</label>
            </div>
            <button class="btn btn-primary" type="submit">Entrar</button>
          </form>
          <p class="mt-3 mb-0"><a href="{% url 'password-recover' %}">Recuperar la contraseña</a></p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
