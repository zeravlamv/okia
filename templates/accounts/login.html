{% extends "base.html" %}
{% block title %}Entrar · OKIA{% endblock %}
{% block content %}
  <h1>Entrar</h1>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <p>
      <label for="username">Usuario</label><br>
      <input id="username" name="username" value="{{ username }}" autocomplete="username" required>
    </p>
    <p>
      <label for="password">Contraseña</label><br>
      <input id="password" name="password" type="password" value="" autocomplete="current-password" required>
    </p>
    <p>
      <label><input type="checkbox" name="remember" {% if remembered %}checked{% endif %}> Recordar usuario</label>
    </p>
    <p>
      <label><input type="checkbox" name="keep"> Mantener la sesión 30 días</label>
    </p>
    <button type="submit">Entrar</button>
  </form>
  <p><a href="{% url 'password-recover' %}">Recuperar la contraseña</a></p>
{% endblock %}
