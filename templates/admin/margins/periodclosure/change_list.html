{% extends "admin/change_list.html" %}

{% block search %}
  <div class="module" style="margin-bottom: 1rem; padding: 0.8rem 1rem;">
    <h2 style="margin-top: 0;">Ejercicio completo</h2>
    <form method="post" style="display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end;">
      {% csrf_token %}
      <label>Empresa
        <select name="codigo_empresa">
          {% for code in exercise_companies %}
            <option value="{{ code }}">{{ code }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Ejercicio
        <select name="ejercicio">
          {% for year in exercise_years %}
            <option value="{{ year }}">{{ year }}</option>
          {% endfor %}
        </select>
      </label>
      <button class="button" type="submit" name="exercise_action" value="close">Cerrar ejercicio</button>
      <button class="button" type="submit" name="exercise_action" value="open">Abrir ejercicio</button>
    </form>
    <p class="help">Cierra o abre los doce meses. No lee el origen ni actualiza las fichas.</p>
  </div>
  {{ block.super }}
{% endblock %}
